<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PriorAuthAI — Agent Health</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0F1720;
    --panel: #161F2B;
    --panel-border: #263242;
    --text: #E6EDF3;
    --text-dim: #7E8CA0;
    --teal: #2DD4BF;
    --amber: #F0A93A;
    --red: #E5484D;
    --grid-line: #1F2937;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--panel-border);
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }

  #status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  #status-dot.live {
    background: var(--teal);
    box-shadow: 0 0 0 3px rgba(45,212,191,0.15);
  }

  #status-dot.stale {
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(240,169,58,0.15);
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 32px 64px;
  }

  .fallback-alert {
    display: none;
    background: rgba(229,72,77,0.1);
    border: 1px solid rgba(229,72,77,0.4);
    color: var(--red);
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 24px;
  }

  .fallback-alert.show {
    display: block;
  }

  .vitals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    margin-bottom: 32px;
  }

  .vital {
    background: var(--panel);
    padding: 20px;
  }

  .vital .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .vital .value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .vital .value.good {
    color: var(--teal);
  }

  .vital .value.warn {
    color: var(--amber);
  }

  .vital .value.bad {
    color: var(--red);
  }

  .vital .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .section-title {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
  }

  /*
   * Failure / anomaly cards
   */

  .failure-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    margin-bottom: 32px;
  }

  .signal {
    background: var(--panel);
    padding: 16px;
  }

  .signal .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .signal .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }

  .signal .value.good {
    color: var(--teal);
  }

  .signal .value.warn {
    color: var(--amber);
  }

  .signal .value.bad {
    color: var(--red);
  }

  /*
   * Charts
   */

  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
  }

  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 20px;
    min-height: 280px;
  }

  .chart-panel h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0 0 16px;
  }

  .chart-panel canvas {
    max-height: 220px;
  }

  /*
   * Evaluation
   */

  .eval-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
  }

  /*
   * Footer
   */

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 32px;
  }

  @media (max-width: 900px) {
    .failure-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 760px) {
    .vitals,
    .charts,
    .eval-row,
    .failure-grid {
      grid-template-columns: 1fr;
    }

    header {
      flex-direction: column;
      gap: 12px;
    }

    main {
      padding: 20px 16px 48px;
    }
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>PriorAuthAI — Agent Health</h1>
    <div class="subtitle">
      Derived from raw traces. Nothing here is hand-entered.
    </div>
  </div>

  <div id="status-pill">
    <span id="status-dot"></span>
    <span id="status-text">Loading…</span>
  </div>
</header>

<main>

  <div class="fallback-alert" id="fallback-alert"></div>

  <!-- =========================================================
       LIVE TRAFFIC
       ========================================================= -->

  <div class="section-title">Live traffic</div>

  <div class="vitals" id="vitals"></div>


  <!-- =========================================================
       FAILURE SIGNALS
       ========================================================= -->

  <div class="section-title">Failure signals</div>

  <div class="failure-grid" id="failure-signals"></div>


  <!-- =========================================================
       ANOMALIES
       ========================================================= -->

  <div class="section-title">Anomalies</div>

  <div class="failure-grid" id="anomaly-signals"></div>


  <!-- =========================================================
       CHARTS
       ========================================================= -->

  <div class="section-title">Trends</div>

  <div class="charts">

    <div class="chart-panel">
      <h3>Task completion vs. escalation</h3>
      <canvas id="chart-outcomes"></canvas>
    </div>

    <div class="chart-panel">
      <h3>Cost per day (USD)</h3>
      <canvas id="chart-cost"></canvas>
    </div>

    <div class="chart-panel">
      <h3>Latency, p50 per day (ms)</h3>
      <canvas id="chart-latency"></canvas>
    </div>

    <div class="chart-panel">
      <h3>Offline eval accuracy</h3>
      <canvas id="chart-eval"></canvas>
    </div>

  </div>


  <!-- =========================================================
       EVALUATION SUMMARY
       ========================================================= -->

  <div class="section-title">Evaluation</div>

  <div class="eval-row" id="eval-summary"></div>


  <footer>
    Reads /api/metrics · derived from raw traces
  </footer>

</main>


<script>

/* =============================================================
   Formatting helpers
   ============================================================= */

const fmtPct = x =>
  x === null || x === undefined
    ? "—"
    : (x * 100).toFixed(1) + "%";

const fmtUsd = x =>
  x === null || x === undefined
    ? "—"
    : "$" + Number(x).toFixed(4);

const fmtMs = x =>
  x === null || x === undefined
    ? "—"
    : Math.round(x) + "ms";


/* =============================================================
   Health classes
   ============================================================= */

function vitalClass(rate, goodAbove, warnAbove) {

  if (rate === null || rate === undefined) {
    return "";
  }

  if (rate >= goodAbove) {
    return "good";
  }

  if (rate >= warnAbove) {
    return "warn";
  }

  return "bad";
}


function inverseVitalClass(rate, goodBelow, warnBelow) {

  if (rate === null || rate === undefined) {
    return "";
  }

  if (rate <= goodBelow) {
    return "good";
  }

  if (rate <= warnBelow) {
    return "warn";
  }

  return "bad";
}


/* =============================================================
   Main health cards
   ============================================================= */

function renderVitals(s) {

  const items = [

    {
      label: "Task completion rate",
      value: fmtPct(s.task_completion_rate),
      cls: vitalClass(
        s.task_completion_rate,
        0.85,
        0.70
      ),
      sub: `${s.completions_count ?? 0} completions`
    },

    {
      label: "Tool call success rate",
      value: fmtPct(s.tool_call_success_rate),
      cls: vitalClass(
        s.tool_call_success_rate,
        0.95,
        0.85
      ),
      sub: `${s.tool_call_count ?? 0} calls`
    },

    {
      label: "Escalation rate",
      value: fmtPct(s.escalation_rate),
      cls: inverseVitalClass(
        s.escalation_rate,
        0.15,
        0.30
      ),
      sub: `${s.escalations_count ?? 0} escalations`
    },

    {
      label: "Invalid schema rate",
      value: fmtPct(s.invalid_schema_rate),
      cls: inverseVitalClass(
        s.invalid_schema_rate,
        0.02,
        0.10
      ),
      sub: ""
    },

    {
      label: "Cost per successful task",
      value: fmtUsd(s.cost_per_successful_task),
      cls: "",
      sub: `total ${fmtUsd(s.total_cost_usd)}`
    },

    {
      label: "User flag rate",
      value: fmtPct(s.user_flag_rate),
      cls: inverseVitalClass(
        s.user_flag_rate,
        0.10,
        0.25
      ),
      sub: `${s.feedback_count ?? 0} feedback events`
    },

    {
      label: "Latency p50 / p95",
      value:
        `${fmtMs(s.latency_p50_ms)} / ${fmtMs(s.latency_p95_ms)}`,
      cls: "",
      sub: ""
    },

    {
      label: "Avg retries per tool call",
      value:
        (s.avg_retries_per_tool_call ?? 0).toFixed(2),
      cls: "",
      sub: ""
    }

  ];

  document.getElementById("vitals").innerHTML =
    items.map(item => `
      <div class="vital">

        <div class="label">
          ${item.label}
        </div>

        <div class="value mono ${item.cls}">
          ${item.value}
        </div>

        <div class="sub">
          ${item.sub}
        </div>

      </div>
    `).join("");
}


/* =============================================================
   Failure signals
   ============================================================= */

function renderFailureSignals(failures) {

  const items = [

    [
      "Wrong tool calls",
      failures.wrong_tool_calls
    ],

    [
      "Wrong arguments",
      failures.wrong_argument_calls
    ],

    [
      "Retrieval failures",
      failures.retrieval_failures
    ],

    [
      "Agent loops",
      failures.agent_loops
    ],

    [
      "Redundant calls",
      failures.redundant_tool_calls
    ],

    [
      "Invalid state transitions",
      failures.invalid_state_transitions
    ],

    [
      "Guardrail violations",
      failures.guardrail_violations
    ],

    [
      "API failures",
      failures.api_failures
    ],

    [
      "HITL rejections",
      failures.hitl_rejections
    ],

    [
      "Incorrect final outcomes",
      failures.incorrect_final_outcomes
    ]

  ];

  document.getElementById("failure-signals").innerHTML =
    items.map(([label, value]) => {

      const count = value ?? 0;

      return `
        <div class="signal">

          <div class="label">
            ${label}
          </div>

          <div class="value ${count > 0 ? "bad" : "good"}">
            ${count}
          </div>

        </div>
      `;

    }).join("");
}


/* =============================================================
   Anomaly signals
   ============================================================= */

function renderAnomalies(anomalies) {

  const items = [

    [
      "Latency spikes",
      anomalies.latency_spikes
    ],

    [
      "Cost anomalies",
      anomalies.cost_anomalies
    ]

  ];

  document.getElementById("anomaly-signals").innerHTML =
    items.map(([label, value]) => {

      const count = value ?? 0;

      return `
        <div class="signal">

          <div class="label">
            ${label}
          </div>

          <div class="value ${count > 0 ? "warn" : "good"}">
            ${count}
          </div>

        </div>
      `;

    }).join("");
}


/* =============================================================
   Evaluation summary
   ============================================================= */

function renderEvaluationSummary(ev) {

  const items = [

    [
      "Intent accuracy",
      ev.intent_accuracy
    ],

    [
      "Refusal accuracy",
      ev.refusal_accuracy
    ],

    [
      "Retrieval hit rate",
      ev.retrieval_hit_rate
    ]

  ];

  document.getElementById("eval-summary").innerHTML =
    items.map(([label, value]) => {

      return `
        <div class="signal">

          <div class="label">
            ${label}
          </div>

          <div class="value">
            ${fmtPct(value)}
          </div>

        </div>
      `;

    }).join("");
}


/* =============================================================
   Fallback alert
   ============================================================= */

function renderFallbackAlert(s) {

  const el =
    document.getElementById("fallback-alert");

  if ((s.fallback_calls ?? 0) > 0) {

    el.classList.add("show");

    el.textContent =
      `${s.fallback_calls} fallback call(s) detected — ` +
      `Gemini silently fell back to mock data. ` +
      `Investigate immediately.`;

  } else {

    el.classList.remove("show");
    el.textContent = "";

  }
}


/* =============================================================
   Chart defaults
   ============================================================= */

const chartDefaults = {

  responsive: true,

  maintainAspectRatio: false,

  plugins: {

    legend: {

      labels: {

        color: "#7E8CA0",

        font: {
          family: "Inter",
          size: 11
        }

      }

    }

  },

  scales: {

    x: {

      ticks: {

        color: "#7E8CA0",

        font: {
          family: "JetBrains Mono",
          size: 10
        }

      },

      grid: {
        color: "#1F2937"
      }

    },

    y: {

      ticks: {

        color: "#7E8CA0",

        font: {
          family: "JetBrains Mono",
          size: 10
        }

      },

      grid: {
        color: "#1F2937"
      },

      beginAtZero: true

    }

  }

};


/* =============================================================
   Chart instances
   ============================================================= */

let outcomeChart = null;
let costChart = null;
let latencyChart = null;
let evalChart = null;


/* =============================================================
   Destroy existing charts
   ============================================================= */

function destroyCharts() {

  if (outcomeChart) {
    outcomeChart.destroy();
    outcomeChart = null;
  }

  if (costChart) {
    costChart.destroy();
    costChart = null;
  }

  if (latencyChart) {
    latencyChart.destroy();
    latencyChart = null;
  }

  if (evalChart) {
    evalChart.destroy();
    evalChart = null;
  }
}


/* =============================================================
   Charts
   ============================================================= */

function renderCharts(m) {

  destroyCharts();

  const trend = m.trend || {};

  const days =
    (trend.days || []).map(
      d => d.slice(5)
    );


  /* -----------------------------------------------------------
     Outcomes
     ----------------------------------------------------------- */

  outcomeChart =
    new Chart(
      document.getElementById("chart-outcomes"),
      {

        type: "bar",

        data: {

          labels: days,

          datasets: [

            {
              label: "Completions",
              data: trend.completions || [],
              backgroundColor: "#2DD4BF"
            },

            {
              label: "Escalations",
              data: trend.escalations || [],
              backgroundColor: "#F0A93A"
            }

          ]

        },

        options: {

          ...chartDefaults,

          scales: {

            ...chartDefaults.scales,

            x: {
              ...chartDefaults.scales.x,
              stacked: true
            },

            y: {
              ...chartDefaults.scales.y,
              stacked: true
            }

          }

        }

      }
    );


  /* -----------------------------------------------------------
     Cost
     ----------------------------------------------------------- */

  costChart =
    new Chart(
      document.getElementById("chart-cost"),
      {

        type: "line",

        data: {

          labels: days,

          datasets: [

            {
              label: "Cost (USD)",
              data: trend.cost_usd || [],
              borderColor: "#2DD4BF",
              backgroundColor: "rgba(45,212,191,0.08)",
              fill: true,
              tension: 0.25
            }

          ]

        },

        options: chartDefaults

      }
    );


  /* -----------------------------------------------------------
     Latency
     ----------------------------------------------------------- */

  latencyChart =
    new Chart(
      document.getElementById("chart-latency"),
      {

        type: "line",

        data: {

          labels: days,

          datasets: [

            {
              label: "Latency p50 (ms)",
              data: trend.latency_p50_ms || [],
              borderColor: "#F0A93A",
              backgroundColor: "rgba(240,169,58,0.08)",
              fill: true,
              tension: 0.25
            }

          ]

        },

        options: chartDefaults

      }
    );


  /* -----------------------------------------------------------
     Evaluation
     ----------------------------------------------------------- */

  const ev = m.eval || {};

  const evalValues = [

    ev.intent_accuracy,
    ev.refusal_accuracy,
    ev.retrieval_hit_rate

  ].map(

    value =>
      value === null || value === undefined
        ? 0
        : value * 100

  );


  evalChart =
    new Chart(
      document.getElementById("chart-eval"),
      {

        type: "bar",

        data: {

          labels: [

            "Intent accuracy",
            "Refusal accuracy",
            "Retrieval hit rate"

          ],

          datasets: [

            {

              label: "Accuracy",

              data: evalValues,

              backgroundColor: [
                "#2DD4BF",
                "#2DD4BF",
                "#2DD4BF"
              ]

            }

          ]

        },

        options: {

          ...chartDefaults,

          indexAxis: "y",

          scales: {

            ...chartDefaults.scales,

            x: {

              ...chartDefaults.scales.x,

              max: 100

            }

          }

        }

      }

    );

}


/* =============================================================
   Load metrics
   ============================================================= */

async function loadMetrics() {

  const statusDot =
    document.getElementById("status-dot");

  const statusText =
    document.getElementById("status-text");

  let m;


  try {

    const res =
      await fetch(
        "/api/metrics",
        {
          cache: "no-store"
        }
      );

    if (!res.ok) {
      throw new Error("Metrics API returned " + res.status);
    }

    m = await res.json();

    statusDot.className = "live";

    statusText.textContent =
      "Live — /api/metrics";

  }

  catch (error) {

    console.error(
      "Metrics API failed:",
      error
    );

    statusText.textContent =
      "API unavailable";

    return;

  }


  if (
    !m.summary ||
    Object.keys(m.summary).length === 0
  ) {

    statusText.textContent =
      "No trace events logged yet";

    return;

  }


  renderVitals(m.summary);

  renderFallbackAlert(m.summary);

  renderFailureSignals(
    m.failures || {}
  );

  renderAnomalies(
    m.anomalies || {}
  );

  renderEvaluationSummary(
    m.eval || {}
  );

  renderCharts(m);

}


/* =============================================================
   Initial load
   ============================================================= */

loadMetrics();

</script>

</body>
</html>
